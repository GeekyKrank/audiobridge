<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SoundBridge</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <img src="../../icons/icon48.png" alt="" width="28" height="28" />
        <span>SoundBridge</span>
      </div>
      <div class="top-right">
        <span id="conn" class="pill" data-state="connecting"><i></i><b>Connecting</b></span>
        <button id="open-settings" class="icon-btn" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-1.7-1L15 3.5h-4l-.4 2.5a7.6 7.6 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7.5 7.5 0 0 0 0 2l-2 1.6 2 3.4 2.4-1c.5.4 1.1.8 1.7 1l.4 2.5h4l.4-2.5c.6-.2 1.2-.6 1.7-1l2.4 1 2-3.4-2-1.6ZM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z" transform="translate(-1 0)"/></svg>
        </button>
      </div>
    </header>

    <main id="view-main">
      <section class="card">
        <div class="card-title">Audio source</div>
        <div id="source" class="tab-row selected"></div>
        <details id="other-tabs">
          <summary><span id="other-count">Other tabs</span></summary>
          <ul id="tab-list" class="tab-list"></ul>
        </details>
      </section>

      <section class="card">
        <div class="card-title">Discord</div>
        <div class="bot-row">
          <span id="bot-dot" class="dot"></span>
          <div class="bot-text">
            <div id="bot-name" class="strong">Bot offline</div>
            <div id="bot-guild" class="muted">—</div>
          </div>
        </div>
        <div class="channel-row">
          <select id="channel" aria-label="Voice channel"><option value="">Auto (your current channel)</option></select>
          <button id="voice-btn" class="btn ghost">Join</button>
        </div>
      </section>

      <button id="share" class="share" data-state="idle">
        <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span id="share-label">Share Audio</span>
      </button>

      <div id="hint" class="hint" hidden></div>

      <section class="stats" id="stats">
        <div><span>Status</span><b id="st-status">Idle</b></div>
        <div><span>Delay</span><b id="st-delay">—</b></div>
        <div><span>Quality</span><b id="st-quality">—</b></div>
        <div><span>Bitrate</span><b id="st-bitrate">—</b></div>
      </section>
    </main>

    <main id="view-settings" hidden>
      <div class="settings-head">
        <button id="close-settings" class="icon-btn" aria-label="Back">←</button>
        <h2>Settings</h2>
      </div>
      <div id="settings-msg" class="hint" hidden></div>
      <form id="settings-form" class="card form" autocomplete="off">
        <label>Server URL
          <input name="serverUrl" type="url" required placeholder="https://soundbridge.example.com" />
        </label>
        <label>Access token
          <input name="accessToken" type="password" required minlength="24" placeholder="ACCESS_TOKEN from server/.env" />
        </label>
        <label>Stream quality
          <select name="bitrate" id="bitrate"></select>
        </label>
        <label>Buffer <output id="buffer-out"></output>
          <input name="bufferMs" type="range" min="100" max="2000" step="50" />
          <small>Lower = less delay, higher = fewer dropouts on a bad connection.</small>
        </label>
        <label class="switch"><input name="autoReconnect" type="checkbox" /> <span>Reconnect automatically</span></label>
        <label class="switch"><input name="monitor" type="checkbox" /> <span>Hear the tab locally while sharing</span></label>
        <label>Local volume <output id="vol-out"></output>
          <input name="monitorVolume" type="range" min="0" max="1" step="0.05" />
        </label>
        <div class="form-actions">
          <button type="button" id="test-conn" class="btn ghost">Test connection</button>
          <button type="submit" class="btn primary">Save</button>
        </div>
        <small class="muted">Quality and buffer changes apply the next time you press Share. Shortcut: <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd> shares the current tab.</small>
      </form>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
